name: Android TV rakendus (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ehita APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Nimeta fail
        run: cp android/app/build/outputs/apk/release/app-release.apk koduvaade.apk

      - uses: actions/upload-artifact@v4
        with:
          name: koduvaade-apk
          path: koduvaade.apk

      - name: Avalda Releases lehel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: koduvaade-${{ github.run_number }}
          name: Koduvaade TV ${{ github.run_number }}
          make_latest: true
          files: koduvaade.apk
          body: |
            Koduvaade Android TV rakendus (NVIDIA Shield jt).
            Allalaadimine: https://github.com/riiel/tv/releases/latest/download/koduvaade.apk
