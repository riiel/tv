plugins {
    id 'com.android.application'
}

android {
    namespace 'ee.riiel.koduvaade'
    compileSdk 34

    defaultConfig {
        applicationId 'ee.riiel.koduvaade'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    // Isiklik rakendus: püsiv allkirjavõti repos, et uus versioon paigalduks vana peale.
    // (Ainult oma seadmetesse paigaldamiseks, mitte Play poodi.)
    signingConfigs {
        koduvaade {
            storeFile file('../koduvaade.keystore')
            storePassword 'koduvaade'
            keyAlias 'koduvaade'
            keyPassword 'koduvaade'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.koduvaade
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
