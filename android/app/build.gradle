plugins {
    id 'com.android.application'
}

android {
    namespace 'ee.riiel.koduvaade'
    compileSdk 34

    defaultConfig {
        applicationId 'ee.riiel.koduvaade'
        minSdk 21
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    buildTypes {
        release {
            minifyEnabled false
            // Isiklik rakendus: allkirjastatakse debug-võtmega, et seda saaks Shieldile otse paigaldada
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
