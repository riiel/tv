<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Pärnu ja Eesti spordikeskus</title>
<link rel="icon" href="/koduvaade-favicon.svg" type="image/svg+xml">
<style>
/* Kujundus: Grafiit Pro (sama mis koduvaate teema "pro") – rahulik, tasane, üks sinine aktsent. */
:root{
  color-scheme: only dark;
  --bg:#0d1117; --glow-1:rgba(56,139,253,.05); --glow-2:rgba(255,255,255,.025);
  --card:#161b22; --card2:#12171e;
  --ink:#e6edf3; --muted:#8b949e; --label:#cbd5e1;
  --line:rgba(240,246,252,.10); --line-soft:rgba(240,246,252,.07);
  --accent:#58a6ff; --accent-strong:#1f6feb; --hi:rgba(56,139,253,.12);
  --win:#3fb950; --draw:#8b949e; --loss:#f85149;
  /* meeskonnamärgid teema enda toonidest */
  --t-bcp:#d29922; --t-vap:#3fb950; --t-ejk:#58a6ff; --t-ekk:#a5b4c3;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:400 17px/1.45 var(--font);
  background:radial-gradient(900px 500px at 20% 0%,var(--glow-2),transparent 70%),radial-gradient(900px 550px at 85% 15%,var(--glow-1),transparent 70%),var(--bg);
  background-attachment:fixed;min-height:100vh}
@media (min-width:1600px){body{font-size:20px}}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.wrap{margin:0;padding:0 3.2vw}
@media (max-aspect-ratio:1/1){.wrap{padding:0 16px}}
.tn{font-variant-numeric:tabular-nums}

/* Päis nagu koduvaates: bränd vasakul, uuendusaeg paremal */
header{padding:0 0 8px}
/* Ülemine riba: täpselt sama koht ja suurus nagu koduvaate päises, et lehtede lüliti ei hüppaks */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:2.6vh 3.4vw 0}
@media (max-aspect-ratio:1/1){.topbar{padding:16px calc(16px + .2vw) 0}}
.brand{display:flex;align-items:center;gap:12px;line-height:normal;font-size:clamp(16px,1.55vw,24px);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.brand-mark{width:14px;height:14px;border-radius:50%;background:var(--accent);flex:none}
.pagesw{display:flex;gap:.9em}
.pagesw a{color:var(--muted);text-decoration:none;font:inherit;letter-spacing:inherit}
.pagesw a[aria-current="page"]{color:var(--ink)}
.pagesw a:hover,.pagesw a:focus-visible{color:var(--ink)}
/* Raadio väike juhtpult (ainult siis, kui spordileht on avatud koduvaate kaudu ja raadio on seal) */
.miniradio{display:none;align-items:center;gap:10px;min-width:0;flex:0 1 auto;margin:0 auto 0 2vw;font-size:clamp(13px,1vw,17px);color:var(--muted)}
.miniradio.on{display:flex}
.miniradio button{flex:none;width:2.2em;height:2.2em;border-radius:50%;border:1.5px solid rgba(240,246,252,.28);background:rgba(240,246,252,.04);display:grid;place-items:center;cursor:pointer;padding:0}
.miniradio button svg{width:1em;height:1em;fill:currentColor}
.miniradio.playing button{border-color:var(--accent);color:var(--accent)}
.miniradio .mr-txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.miniradio b{color:var(--ink);font-weight:700;margin-right:.4em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stamp{color:var(--muted)}
.now{display:flex;align-items:baseline;gap:10px;font-size:clamp(14px,1.3vw,21px);font-weight:600;color:var(--ink)}
.now #clock{font-weight:750;letter-spacing:-.02em}.now .sep{color:var(--accent)}.now #date{color:#cbd5e1;font-weight:500}
.next{margin-top:1.8vh;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;
  background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:22px 26px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35)}
.next .lbl{color:var(--label);font-weight:700;font-size:clamp(11px,.95vw,15px);text-transform:uppercase;letter-spacing:.08em}
.next .teams{font-size:clamp(30px,3.6vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.next .meta{color:var(--muted);font-size:clamp(15px,1.25vw,20px);margin-top:6px}
.cd{display:flex;gap:10px}
.cd div{background:rgba(240,246,252,.04);border:1px solid var(--line);border-radius:12px;min-width:80px;padding:10px 12px;text-align:center}
.cd b{display:block;font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

main{display:grid;gap:30px;padding:22px 0 48px}
h2{color:var(--label);font-weight:700;font-size:clamp(12px,1vw,16px);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}

/* Kaardid */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px 20px 18px 24px;
  display:grid;gap:12px;align-content:start;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.card:hover{border-color:rgba(240,246,252,.22)}
.card[aria-selected="true"]{border-color:var(--accent-strong);box-shadow:0 0 0 1px var(--accent-strong),0 8px 24px rgba(0,0,0,.35)}
.card h3{font-size:clamp(18px,1.5vw,24px);font-weight:800;letter-spacing:-.02em}
.card .status{font-size:clamp(20px,1.7vw,28px);font-weight:800;letter-spacing:-.03em}
.card .status small{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:2px}
.row{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:baseline;border-top:1px solid var(--line-soft);padding-top:10px;font-size:16px}
.row .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.row .v b{font-weight:700}
.row .v small{display:block;color:var(--muted);font-size:14px}
.pill{display:inline-block;font-weight:800;font-size:13px;border-radius:6px;padding:1px 7px;margin-right:6px;color:#0d1117}
.W{background:var(--win)} .D{background:var(--draw)} .L{background:var(--loss)}

/* Kalender */
.panel{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:6px 22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35)}
.ev{display:grid;grid-template-columns:110px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line-soft)}
.ev:first-child{border-top:0}
.ev .when{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ev .when small{display:block;font-size:14px;font-weight:500;letter-spacing:0;color:var(--muted)}
.ev .what{font-weight:700;font-size:18px}
.ev .what small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
@media (max-width:560px){.ev{grid-template-columns:84px 1fr}.ev .tag{grid-column:2;justify-self:start}}

/* Detailid */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center}
.tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff}
.facts{color:var(--muted);font-size:15px;margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 20px}
.facts b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.box{grid-column:span 6;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35)}
.box.w12{grid-column:span 12}.box.w8{grid-column:span 8}.box.w4{grid-column:span 4}
@media (max-width:900px){.box,.box.w8,.box.w4{grid-column:span 12}}
.box h3{color:var(--label);font-weight:700;font-size:clamp(11px,.95vw,15px);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:8px;border-bottom:1px solid var(--line-soft)}
th.n,td.n{text-align:right}
tr.me td{background:var(--hi);font-weight:700;color:#fff}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.cut td{border-bottom:1px dashed rgba(240,246,252,.25)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);align-items:baseline;break-inside:avoid}
.list li:first-child{border-top:0}
.list .dt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.list .note{display:block;font-size:13px;color:var(--muted)}
.list .sc{font-size:19px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sc.W{background:none;color:var(--win)}.sc.L{background:none;color:var(--loss)}.sc.D{background:none;color:var(--draw)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:rgba(240,246,252,.03);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.stat span{font-size:12px;color:var(--muted)}
.ldg{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:12px 0 4px}
.ld{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.track{height:8px;background:rgba(240,246,252,.06);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.ld .v{font-size:18px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.note2{font-size:13px;color:var(--muted);margin:10px 0 0}
.callout{border-left:3px solid var(--accent);background:rgba(56,139,253,.08);padding:10px 14px;border-radius:0 10px 10px 0;font-size:15px;margin-top:12px}
.err{background:rgba(248,81,73,.12);color:#ffb3ae;border:1px solid rgba(248,81,73,.4);border-radius:10px;padding:12px 16px}
footer{border-top:1px solid var(--line);padding:20px 0 36px;color:var(--muted);font-size:14px}
footer a{margin-right:14px;display:inline-block}
html,body{overflow-x:hidden}

/* Ikoonid: koduvaatega sama joonistiil (ühevärvilised, teksti värvi) */
.ico{width:1em;height:1em;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.14em}
.flag{width:1.25em;height:.84em;flex-shrink:0;border-radius:2px;vertical-align:-0.06em;box-shadow:0 0 0 1px rgba(240,246,252,.28)}
.tico{display:inline-flex;align-items:center;gap:5px;color:var(--c);margin-right:8px}
.card h3{display:flex;align-items:center}
.tag::before{display:none}
.tag .tico{margin-right:0;gap:4px}
.tab .tico{margin-right:0}
.card h3 .ico{width:1.15em;height:1.15em}
.tag .ico{width:1.35em;height:1.35em;stroke-width:1.9}
.tab .ico{width:1.2em;height:1.2em}
.tab[aria-selected="true"] .tico{color:#fff}
/* Klubide logod ja riigilipud */
.lg{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-0.28em;margin-right:.4em;background:#fff;border-radius:5px;padding:1px;flex-shrink:0}
.lg.fl{background:none;padding:0;border-radius:2px;width:1.3em;height:.9em;vertical-align:-0.1em;object-fit:cover;box-shadow:0 0 0 1px rgba(240,246,252,.25)}
.tn-team{white-space:nowrap}
/* Uued osad: tagasilink, vorm, mängupäev, omavahelised mängud, telekarežiim */
.form{display:inline-flex;gap:3px;margin-left:auto;padding-left:8px}
.form i{font-style:normal;font-size:10px;font-weight:800;letter-spacing:0;width:17px;height:17px;border-radius:4px;display:grid;place-items:center;color:#0d1117}
.next.today{border-color:var(--accent-strong);box-shadow:0 0 0 1px var(--accent-strong),0 8px 24px rgba(0,0,0,.35)}
.next.today .lbl{color:var(--accent)}
.next.live{border-color:var(--loss);box-shadow:0 0 0 1px var(--loss),0 8px 24px rgba(0,0,0,.35)}
.next.live .lbl{color:var(--loss)}
.next.live .lbl::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--loss);margin-right:8px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.next.live .lbl::before{animation:none}}
.ev.live .when{color:var(--loss)}
.h2h{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
.h2h:empty{display:none}
.h2h b{color:var(--ink);font-variant-numeric:tabular-nums}
.h2h .pill{font-size:11px;padding:0 5px;margin-right:5px}
.keyhint{font-size:12px;color:var(--muted);align-self:center;margin-left:auto}
.tab.auto[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
@media (max-width:900px){.keyhint{display:none}}
/* Kompaktne paigutus */
body{font-size:16px}
@media (min-width:1600px){body{font-size:18px}}
header{padding:0 0 4px}
.next{margin-top:1.8vh;padding:12px 18px;gap:10px 24px}
.next .teams{font-size:clamp(22px,2.4vw,34px);margin-top:2px}
.next .meta{font-size:clamp(13px,1vw,16px);margin-top:2px}
.cd{gap:6px}.cd div{min-width:60px;padding:6px 8px;border-radius:10px}.cd b{font-size:26px}.cd span{font-size:10px}
main{gap:18px;padding:14px 0 28px}
h2{margin-bottom:8px}
.topgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:stretch}
.topgrid>section{display:flex;flex-direction:column;min-height:0}
.topgrid .cards{flex:1;grid-auto-rows:1fr}
.topgrid #upcoming{flex:1;display:flex;flex-direction:column;justify-content:space-around}
.topgrid #upcoming .ev{flex:1}
@media (max-width:1050px){.topgrid{grid-template-columns:1fr}}
.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{padding:11px 14px 11px 18px;gap:7px}
.card h3{font-size:clamp(15px,1.15vw,19px)}
.card .status{font-size:clamp(17px,1.35vw,22px)}
.card .status small{font-size:12px}
.row{grid-template-columns:70px 1fr;padding-top:6px;font-size:14px;gap:6px}
.row .k{font-size:10px}
.row .v small{font-size:12px}
.panel{padding:2px 16px}
.ev{grid-template-columns:72px 1fr auto;gap:10px;padding:7px 0}
.ev .when{font-size:15px}.ev .when small{font-size:12px}
.ev .what{font-size:15px}.ev .what small{font-size:12px}
.tag{font-size:11px;padding:2px 8px 2px 6px}
.tabs{margin-bottom:8px;gap:6px}.tab{padding:5px 12px;font-size:14px}
.facts{font-size:13px;margin:0 0 8px}
.grid{gap:12px}
.box{padding:12px 14px}
.box h3{margin-bottom:6px}
table{font-size:14px}
th{padding:4px 6px}
td{padding:4px 6px}
.list li{padding:5px 0;grid-template-columns:62px 1fr auto;gap:8px}
.list .dt{font-size:12px}.list .note{font-size:12px}.list .sc{font-size:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.stat{padding:8px 10px}.stat b{font-size:22px}.stat span{font-size:11px}
.stack{grid-column:span 4;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack.w6{grid-column:span 6}.stack.w8{grid-column:span 8}
.stack>.box{grid-column:auto}
@media (max-width:900px){.stack,.stack.w6,.stack.w8{grid-column:span 12}}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 24px}
.ldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 24px}
.ldg{margin:4px 0 2px}
.ld{grid-template-columns:120px 1fr 40px;font-size:13px;margin:3px 0}
.ld .v{font-size:15px}
.note2{font-size:12px;margin-top:6px}
.callout{font-size:13px;padding:7px 12px;margin-top:8px}
footer{padding:14px 0 24px;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <div class="brand"><span class="brand-mark"></span><nav class="pagesw" aria-label="Lehed"><a href="/">Koduvaade</a><a href="/sport/" aria-current="page">Sport</a></nav></div>
    <div class="miniradio" id="miniradio" aria-label="Raadio"><button id="mr-btn" type="button" aria-label="Raadio mängi või paus"><svg viewBox="0 0 24 24" id="mr-icon"><path d="M8 5.14v14l11-7-11-7z"/></svg></button><span class="mr-txt"><b id="mr-station"></b><span id="mr-title"></span></span></div>
    <div class="now"><span id="clock">--:--</span><span class="sep">•</span><span id="date"></span></div>
  </div>
  <div class="wrap">
    <h1 class="sr">Pärnu ja Eesti spordikeskus</h1>
    <div class="next" id="next" aria-live="polite">
      <div>
        <div class="lbl" id="nextLbl">Järgmine mäng</div>
        <div class="teams" id="nextTeams">–</div>
        <div class="meta" id="nextMeta"></div>
        <div class="h2h" id="nextH2H"></div>
      </div>
      <div class="cd" id="countdown" aria-label="Aega mängu alguseni"></div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="topgrid">
    <section aria-labelledby="h-teams"><h2 id="h-teams">Meeskonnad</h2><div class="cards" id="cards" role="tablist"></div></section>
    <section aria-labelledby="h-cal"><h2 id="h-cal">Tulevad mängud</h2><div class="panel" id="upcoming"></div></section>
  </div>

  <section aria-labelledby="h-det" id="detail">
    <h2 id="h-det">Tabelid ja tulemused</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="teamDetail"></div>
  </section>
</main>

<footer><div class="wrap">
  <div style="margin-bottom:6px"><span class="stamp" id="stamp">Laen andmeid…</span> <span id="srcNote"></span></div>
  <div id="sources"></div>
</div></footer>

<script>
// Kui spordileht on avatud koduvaate sees: "Koduvaade" viib tagasi ilma laadimiseta ja raadio jääb mängima.
(function(){
  let host = null;
  try { if (window.parent !== window && window.parent.koduRadio) host = window.parent; } catch (e) {}
  if (!host) return;
  const homeLink = document.querySelector('.pagesw a[href="/"]');
  if (homeLink) homeLink.addEventListener('click', e => { e.preventDefault(); host.closeSport(); });
  // Puldi tagasi-nupp / Backspace / Escape viib samuti koduvaatesse
  addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'BrowserBack' || e.key === 'GoBack') { e.preventDefault(); host.closeSport(); } });

  const box = document.getElementById('miniradio'), icon = document.getElementById('mr-icon');
  const PLAY = '<path d="M8 5.14v14l11-7-11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  box.classList.add('on');
  function sync(){
    let st; try { st = host.koduRadio.state(); } catch (e) { return; }
    box.classList.toggle('playing', st.playing);
    icon.innerHTML = st.playing ? PAUSE : PLAY;
    document.getElementById('mr-station').textContent = st.station;
    document.getElementById('mr-title').textContent = st.playing ? st.title : 'pausil';
  }
  document.getElementById('mr-btn').addEventListener('click', () => { try { host.koduRadio.toggle(); } catch (e) {} setTimeout(sync, 400); setTimeout(sync, 2500); });
  sync(); setInterval(sync, 2000);
})();

const COLORS={bcp:"var(--t-bcp)",vap:"var(--t-vap)",ejk:"var(--t-ejk)",ekk:"var(--t-ekk)"};
const SHORT={bcp:"BC Pärnu",vap:"Vaprus",ejk:"Jalgpallikoondis",ekk:"Korvpallikoondis"};
const OWN={bcp:["BC Pärnu"],vap:["Vaprus","Pärnu JK Vaprus"],ejk:["Eesti"],ekk:["Eesti"]};
const DUR={bcp:135,ekk:135,vap:120,ejk:120}; // mängu ligikaudne kestus minutites
const MONTHS=["jaanuar","veebruar","märts","aprill","mai","juuni","juuli","august","september","oktoober","november","detsember"];
const WDL=["pühapäev","esmaspäev","teisipäev","kolmapäev","neljapäev","reede","laupäev"];
const WD=["P","E","T","K","N","R","L"];
const RL={W:"V",D:"Vi",L:"K"};
const ICON_PATHS={
  basket:'<circle cx="12" cy="12" r="10"/><path d="M12 2v20M2 12h20M5.2 4.8c3.3 3.2 3.3 11.2 0 14.4M18.8 4.8c-3.3 3.2-3.3 11.2 0 14.4"/>',
  football:'<circle cx="12" cy="12" r="10"/><path d="m12 7.2 4.3 3.1-1.6 5H9.3l-1.6-5z"/><path d="M12 7.2V2.3M16.3 10.3l4.6-1.5M14.7 15.3l2.9 4M9.3 15.3l-2.9 4M7.7 10.3 3.1 8.8"/>'
};
const ico=n=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[n]}</svg>`;
const FLAG='<svg class="flag" viewBox="0 0 33 21" aria-label="Eesti" role="img"><rect width="33" height="7" fill="#0072ce"/><rect y="7" width="33" height="7" fill="#000"/><rect y="14" width="33" height="7" fill="#fff"/></svg>';
const SPORT={bcp:"basket",vap:"football",ejk:"football",ekk:"basket"};
const NATIONAL={ejk:true,ekk:true};
const tIco=k=>`<span class="tico" style="--c:${COLORS[k]}" title="${SPORT[k]==="basket"?"Korvpall":"Jalgpall"}${NATIONAL[k]?" · koondis":""}">${ico(SPORT[k])}${NATIONAL[k]?FLAG:""}</span>`;
let DATA=null, SIG="", LIVE=null, sel="bcp", auto=false, autoTimer=null;
try{const s=localStorage.getItem("sk-team"); if(s) sel=s; auto=localStorage.getItem("sk-auto")==="1";}catch(_){}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function logoUrl(n){
  if(!DATA||!DATA.logos) return null;
  const k=(DATA.logoAliases&&DATA.logoAliases[n])||n; const u=DATA.logos[k];
  if(!u) return null; return u.startsWith("flag:")?{u:`https://flagcdn.com/w40/${u.slice(5)}.png`,f:true}:{u,f:false};
}
function team(n){const l=logoUrl(String(n).trim());return l?`<span class="tn-team"><img class="lg${l.f?" fl":""}" src="${l.u}" alt="" onerror="this.remove()">${esc(n)}</span>`:esc(n);}
function teamsTitle(t){const m=String(t).split(/( – | vs )/);return m.map((x,i)=>i%2?esc(x):team(x)).join("");}
const sides=t=>String(t).split(/ – | vs /).map(x=>x.trim());
function tzOff(d){const [y,m,day]=d.split("-").map(Number);
  const lastSun=mo=>{const x=new Date(Date.UTC(y,mo,0));return x.getUTCDate()-x.getUTCDay();};
  return ((m>3&&m<10)||(m===3&&day>=lastSun(3))||(m===10&&day<lastSun(10)))?"+03:00":"+02:00";}
const startOf=e=>new Date(e.date+"T"+(e.time||"23:59")+":00"+tzOff(e.date));
const dayStart=e=>new Date(e.date+"T00:00:00"+tzOff(e.date));
const endOf=e=>e.time?startOf(e).getTime()+(DUR[e.team]||120)*6e4:dayStart(e).getTime()+864e5;
const wdOf=e=>new Date(e.date+"T12:00:00Z").getUTCDay();
function dateTxt(e,long){const [y,m,d]=e.date.split("-").map(Number);
  return long?`${WDL[wdOf(e)]}, ${d}. ${MONTHS[m-1]}`:`${WD[wdOf(e)]} ${d}.${String(m).padStart(2,"0")}`;}
const shortDate=e=>{const [y,m,d]=e.date.split("-");return `${d}.${m}.${y.slice(2)}`;};
function relDay(e){const now=new Date(),t=new Date(now.toLocaleString("en-US",{timeZone:"Europe/Tallinn"}));
  const today=new Date(t.getFullYear(),t.getMonth(),t.getDate()); const [y,m,d]=e.date.split("-").map(Number);
  const diff=Math.round((new Date(y,m-1,d)-today)/864e5); return diff===0?"täna":diff===1?"homme":"";}
const isUp=(e,now)=>!e.score&&startOf(e).getTime()+3*36e5>now.getTime();
const isLive=(e,now)=>!e.score&&e.time&&startOf(e)<=now&&endOf(e)>now.getTime();
const upcoming=now=>DATA.events.filter(e=>isUp(e,now)).sort((a,b)=>startOf(a)-startOf(b));
const played=k=>DATA.events.filter(e=>e.team===k&&e.score).sort((a,b)=>startOf(b)-startOf(a));
function* walk(ps){for(const p of ps||[]){if(p.type==="stack") yield* walk(p.panels); else yield p;}}

// Otseandmed (/api/sport) loetakse alaliitude lehtedelt ja kirjutatakse varuandmete (data.json) peale
function applyLive(d,L){
  if(!L||!L.ok) return false;
  const P={}; for(const t of Object.values(d.teams||{})) for(const p of walk(t.panels)) if(p.key) P[p.key]=p;
  for(const [k,patch] of Object.entries(L.panels||{})) if(P[k]) Object.assign(P[k],patch);
  for(const [k,s] of Object.entries(L.summaries||{})) if(d.teams[k]) d.teams[k].summary=Object.assign({},d.teams[k].summary,s);
  for(const g of L.eventSets||[]){
    if(!g.events||!g.events.length) continue;
    const re=g.re?new RegExp(g.re):null, dates=new Set(g.events.map(e=>e.date));
    d.events=d.events.filter(e=>!(e.team===g.team&&(re?re.test(e.comp||""):dates.has(e.date)))).concat(g.events);
  }
  d.logos=Object.assign({},L.logos||{},d.logos||{});
  return true;
}

function formHtml(k){
  const f=played(k).slice(0,5).reverse(); if(!f.length) return "";
  return `<span class="form" title="Viimased ${f.length} mängu, uusim paremal">${f.map(e=>`<i class="${e.result}">${RL[e.result]||""}</i>`).join("")}</span>`;
}
function renderCards(){
  const now=new Date();
  document.getElementById("cards").innerHTML=Object.entries(DATA.teams).map(([k,t])=>{
    const s=t.summary||{};
    const n=DATA.events.filter(e=>e.team===k&&isUp(e,now)).sort((a,b)=>startOf(a)-startOf(b))[0];
    const l=played(k)[0];
    const rel=n?relDay(n):"";
    const nextV=n?`<b>${teamsTitle(n.title)}</b><small>${isLive(n,now)?"käib praegu · ":""}${rel?rel+", ":""}${dateTxt(n,true)}${n.time?" kell "+n.time:""}</small>`:`<small>${esc(s.nextText||"Uut mängu pole veel kalendris")}</small>`;
    const lastV=l?`<span class="pill ${l.result}">${RL[l.result]}</span><b class="tn">${esc(l.score)}</b> ${teamsTitle(l.title)}`:"–";
    return `<button class="card" role="tab" aria-selected="${k===sel}" data-k="${k}" style="--c:${COLORS[k]}">
      <h3>${tIco(k)}${esc(t.name)}${formHtml(k)}</h3>
      <div class="status">${esc(s.headline)}${s.sub?" · "+esc(s.sub):""}<small>${esc(s.competition)}</small></div>
      <div class="row"><span class="k">Järgmine</span><span class="v">${nextV}</span></div>
      <div class="row"><span class="k">Viimane</span><span class="v">${lastV}</span></div>
    </button>`;}).join("");
  document.querySelectorAll(".card").forEach(b=>b.addEventListener("click",()=>{select(b.dataset.k);document.getElementById("detail").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}));
}
function renderUpcoming(){
  const now=new Date(), up=upcoming(now).slice(0,7);
  document.getElementById("upcoming").innerHTML=up.length?up.map(e=>{const rel=relDay(e), live=isLive(e,now);
    return `<div class="ev${live?" live":""}" style="--c:${COLORS[e.team]}">
      <div class="when">${live?"Käib":rel?rel[0].toUpperCase()+rel.slice(1):dateTxt(e,false)}<small>${e.time?"kell "+e.time:(rel?dateTxt(e,false):"")}</small></div>
      <div class="what">${teamsTitle(e.title)}<small>${esc(e.comp)}${e.place?" · "+esc(e.place):""}</small></div>
      <span class="tag" style="--c:${COLORS[e.team]}">${tIco(e.team)}${SHORT[e.team]}</span></div>`;}).join("")
    :'<div class="ev"><div></div><div class="what">Kalendris pole praegu tulevaid mänge.</div></div>';
}
function panelHtml(p,k){
  if(p.type==="stack") return `<div class="stack w${p.width||4}">${(p.panels||[]).map(q=>panelHtml(Object.assign({},q,{width:0}),k)).join("")}</div>`;
  const w=p.width===12?"w12":p.width===8?"w8":p.width===4?"w4":"";
  let b=p.text?`<p style="margin-top:0">${esc(p.text)}</p>`:"";
  if(p.type==="table"){
    b+=`<div class="tbl"><table><thead><tr>${p.columns.map((c,i)=>`<th class="${i>=2?"n":""}">${esc(c)}</th>`).join("")}</tr></thead><tbody>`+
      p.rows.map(r=>`<tr class="${r[1]===p.highlight?"me":""} ${p.cutAfter&&r[0]===p.cutAfter?"cut":""}">${r.map((v,i)=>`<td class="${i>=2?"n":""}">${i===1?team(v):esc(v)}</td>`).join("")}</tr>`).join("")+`</tbody></table></div>`;
  }else if(p.type==="list"){
    const li=i=>`<li><span class="dt">${esc(i.date)}</span><span>${teamsTitle(i.title)}<span class="note">${esc(i.note)}</span></span><span class="sc ${i.result||""}">${esc(i.score)}</span></li>`;
    if((p.width===12||p.width===8)&&p.items.length>3){const h=Math.ceil(p.items.length/2);
      b+=`<div class="cols2"><ul class="list">${p.items.slice(0,h).map(li).join("")}</ul><ul class="list">${p.items.slice(h).map(li).join("")}</ul></div>`;}
    else if(!p.items.length) b+=`<p class="note2" style="margin-top:0">${p.title==="Tulevad mängud"?"Tulevaid mänge pole veel teada.":"Mänge pole veel."}</p>`;
    else b+=`<ul class="list">${p.items.map(li).join("")}</ul>`;
  }else if(p.type==="stats"){
    b+=`<div class="stats">${p.items.map(([v,l])=>`<div class="stat"><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>`;
  }else if(p.type==="leaders"){
    b+='<div class="ldgrid">'+p.groups.map(g=>{const mx=Math.max(...g.rows.map(r=>r[1]));return `<div><div class="ldg">${esc(g.label)}</div>`+
      g.rows.map(([n,v])=>`<div class="ld"><span>${esc(n)}</span><div class="track"><div class="fill" style="width:${(v/mx*100).toFixed(1)}%"></div></div><span class="v">${Number(v).toFixed(1).replace(".",",")}</span></div>`).join("")+`</div>`;}).join("")+'</div>';
  }
  if(p.note) b+=`<p class="note2">${esc(p.note)}</p>`;
  if(p.callout) b+=`<div class="callout">${esc(p.callout)}</div>`;
  return `<div class="box ${w}"><h3>${esc(p.title)}</h3>${b}</div>`;
}
// Meeskonna enda kalender: kuni 12 järgmist mängu
function teamCalendar(k){
  const WD=["P","E","T","K","N","R","L"];
  const up=upcoming(new Date()).filter(e=>e.team===k).slice(0,12);
  return {type:"list",width:12,title:"Tulevad mängud",items:up.map(e=>{const [y,m,d]=e.date.split("-").map(Number);
    return {date:WD[new Date(Date.UTC(y,m-1,d)).getUTCDay()]+" "+d+"."+String(m).padStart(2,"0"),title:e.title,
      note:[e.comp,e.place,e.tv?"Ülekanne: "+e.tv:""].filter(Boolean).join(" · "),score:e.time||"",result:""};})};
}
function select(k){
  if(!DATA.teams[k]) k=Object.keys(DATA.teams)[0];
  sel=k; try{localStorage.setItem("sk-team",k)}catch(_){}
  const t=DATA.teams[k];
  document.getElementById("tabs").innerHTML=Object.keys(DATA.teams).map(x=>`<button class="tab" role="tab" aria-selected="${x===k}" data-k="${x}" style="--c:${COLORS[x]}">${tIco(x)}${esc(DATA.teams[x].name)}</button>`).join("")+
    `<span class="keyhint">← → vahetab meeskonda</span><button class="tab auto" id="autoBtn" aria-pressed="${auto}">${auto?"Vahetub ise · peata":"Vaheta ise"}</button>`;
  document.querySelectorAll(".tab[data-k]").forEach(b=>b.addEventListener("click",()=>select(b.dataset.k)));
  document.getElementById("autoBtn").addEventListener("click",()=>setAuto(!auto));
  document.querySelectorAll(".card").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.k===k)));
  document.getElementById("teamDetail").innerHTML=`<div style="--c:${COLORS[k]}">
    <p class="facts">${(t.facts||[]).map(([a,v])=>`<span>${esc(a)}: <b>${esc(v)}</b></span>`).join("")}</p>
    <div class="grid">${panelHtml(teamCalendar(k),k)}${(t.panels||[]).map(p=>panelHtml(p,k)).join("")}</div></div>`;
}
function step(dir){const ks=Object.keys(DATA.teams);select(ks[(ks.indexOf(sel)+dir+ks.length)%ks.length]);}
function setAuto(on){
  auto=on; try{localStorage.setItem("sk-auto",on?"1":"0")}catch(_){}
  clearInterval(autoTimer); autoTimer=on?setInterval(()=>step(1),20000):null;
  if(DATA) select(sel);
}
document.addEventListener("keydown",e=>{
  if(!DATA||e.ctrlKey||e.altKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight"){step(1);e.preventDefault();}
  else if(e.key==="ArrowLeft"){step(-1);e.preventDefault();}
});
function h2hHtml(n){
  const own=OWN[n.team]||[], opp=sides(n.title).find(x=>!own.includes(x)); if(!opp) return "";
  const g=played(n.team).filter(e=>sides(e.title).includes(opp)).slice(0,4); if(!g.length) return "";
  return `<span>Omavahel:</span>`+g.map(e=>`<span><span class="pill ${e.result}">${RL[e.result]}</span><b>${esc(e.score)}</b> ${own.includes(sides(e.title)[0])?"kodus":"võõrsil"} · ${shortDate(e)}</span>`).join("");
}
function tick(){
  if(!DATA) return; const now=new Date();
  const n=DATA.events.filter(e=>!e.score&&endOf(e)>now.getTime()).sort((a,b)=>startOf(a)-startOf(b))[0];
  const box=document.getElementById("next"),Lb=document.getElementById("nextLbl"),T=document.getElementById("nextTeams"),M=document.getElementById("nextMeta"),H=document.getElementById("nextH2H"),C=document.getElementById("countdown");
  if(!n){box.className="next";Lb.textContent="Järgmine mäng";T.textContent="Kalender on tühi";M.textContent="";H.innerHTML="";C.innerHTML="";return;}
  const rel=relDay(n), live=isLive(n,now);
  box.className="next"+(live?" live":rel==="täna"?" today":"");
  Lb.textContent=live?"Käib praegu":rel==="täna"?"Täna mängib":"Järgmine mäng";
  const key=n.team+n.date+n.title;
  if(T.dataset.k!==key){T.dataset.k=key;T.innerHTML=teamsTitle(n.title);H.innerHTML=h2hHtml(n);}
  M.textContent=`${rel?rel[0].toUpperCase()+rel.slice(1)+", ":""}${dateTxt(n,true)}${n.time?" kell "+n.time:""} · ${n.comp}${n.place?" · "+n.place:""}${n.tv?" · Ülekanne: "+n.tv:""}`;
  if(live){C.innerHTML=`<div><b>Käib</b><span>tulemus pärast mängu</span></div>`;return;}
  if(!n.time){C.innerHTML="";return;}
  const ms=Math.max(0,startOf(n)-now), d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60;
  C.innerHTML=`<div><b>${d}</b><span>päeva</span></div><div><b>${String(h).padStart(2,"0")}</b><span>tundi</span></div><div><b>${String(m).padStart(2,"0")}</b><span>minutit</span></div>`;
}
function clock(){const d=new Date();
  document.getElementById("clock").textContent=d.toLocaleTimeString("et-EE",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Tallinn"});
  document.getElementById("date").textContent=d.toLocaleDateString("et-EE",{weekday:"long",day:"numeric",month:"long",timeZone:"Europe/Tallinn"});}
clock(); setInterval(clock,10000);
function renderStamp(){
  const hm=x=>new Date(x).toLocaleString("et-EE",{day:"numeric",month:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Tallinn"});
  const miss=LIVE?Object.values(LIVE.src||{}).filter(v=>v!==true).length:0;
  document.getElementById("stamp").textContent=LIVE?`Viimati kontrollitud ${hm(LIVE.updated)}.`+(miss?" Osa allikaid ei vastanud.":""):`Varuandmed seisuga ${hm(DATA.updated)}.`;
}
function renderAll(){
  renderStamp();
  document.getElementById("nextTeams").dataset.k="";
  renderCards(); renderUpcoming(); select(sel); tick();
  document.getElementById("srcNote").textContent=(DATA.note||"")+" Kellaajad on Eesti aja järgi.";
  document.getElementById("sources").innerHTML="Allikad: "+(DATA.sources||[]).map(([n,u])=>`<a href="${esc(u)}">${esc(n)}</a>`).join("");
}
async function getLive(){
  try{
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),20000);
    const r=await fetch("/api/sport",{signal:ctl.signal}); clearTimeout(t);
    if(!r.ok) return null; const j=await r.json(); return j&&j.ok?j:null;
  }catch(_){return null;}
}
async function load(first){
  try{
    const [r,L]=await Promise.all([fetch("/sport/data.json?t="+Date.now(),{cache:"no-store"}),getLive()]);
    if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    const ok=applyLive(d,L);
    const sig=d.updated+"|"+(ok?JSON.stringify([L.src,L.panels,L.summaries,L.eventSets]):"-");
    if(first||sig!==SIG){DATA=d;SIG=sig;LIVE=ok?L:null;renderAll();}
    else {if(ok) LIVE=L; renderStamp();renderCards();renderUpcoming();tick();}
  }catch(e){ if(!DATA) document.getElementById("main").insertAdjacentHTML("afterbegin",'<div class="err">Andmeid ei saanud laadida. Proovi lehte värskendada.</div>'); }
}
load(true).then(()=>{if(auto) setAuto(true);});
setInterval(tick,30000);
setInterval(()=>load(false),3*60*1000);
</script>
